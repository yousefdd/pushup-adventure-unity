name: Android APK (IL2CPP)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails early, with a clear message, when the Unity licence secrets are missing.
  license:
    name: Check Unity licence secrets
    runs-on: ubuntu-latest
    steps:
      - name: Secrets present
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README.md, section 'Unity licence'."
            exit 1
          fi

  test:
    name: Edit mode tests
    needs: license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          testMode: editmode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Edit mode test results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: artifacts
          if-no-files-found: ignore
      - name: Push logs to the ci-logs-test branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/push-logs.sh test

  android:
    name: Build APK (IL2CPP, ARM64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Android IL2CPP builds need more room than the runner has free.
      - uses: jlumbroso/free-disk-space@v1.3.1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: DiceQuest
          buildMethod: DiceQuest.EditorTools.BuildScript.BuildFromCommandLine
          versioning: Semantic
      - uses: actions/upload-artifact@v4
        with:
          name: DiceQuest-apk
          path: build/Android
      - name: Push logs to the ci-logs-android branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/push-logs.sh android

  # The same game for the browser, to preview and record it without a phone.
  webgl:
    name: Build WebGL preview
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          targetPlatform: WebGL
          buildName: DiceQuest
          buildMethod: DiceQuest.EditorTools.BuildScript.BuildWebGLFromCommandLine
      - uses: actions/upload-artifact@v4
        with:
          name: DiceQuest-webgl
          path: build/WebGL
      - name: Push logs to the ci-logs-webgl branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/push-logs.sh webgl
      # The preview also goes to the webgl-preview branch, so it can be
      # fetched with plain git, served anywhere and recorded.
      - name: Publish preview to the webgl-preview branch
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          cd build/WebGL/DiceQuest
          git init -q -b webgl-preview
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "WebGL preview of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" webgl-preview
